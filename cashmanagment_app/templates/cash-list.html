{% extends 'master/base.html' %}


{% block content %}
<h1>Your Cash</h1>
<a href="{% url 'add_cash' %}" class="btn btn-info">Add Cash</a>

<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Source</th>
      <th scope="col">Date & Time</th>
      <th scope="col">Amount</th>
      <th scope="col">Description</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    
    {% for cash in cash_data %}

    <tr>
      <th scope="row">{{forloop.counter}}</th>
      <td>{{cash.source}}</td>
      <td>{{cash.datetime}}</td>
      <td>{{cash.amount}}</td>
      <td>{{cash.description}}</td>
      <td>
        <a href="{% url 'edit_page' cash.id %}" class="btn btn btn-outline-warning">Edit</a>
        <a href="{% url 'delete_page' cash.id %}" class="btn btn btn-outline-danger">Delete</a>
      </td>
      
    </tr>
        
    {% endfor %}
        
    
  </tbody>
</table>
    
{% endblock content %}
